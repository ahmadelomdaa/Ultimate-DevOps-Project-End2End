apiVersion: apps/v1
kind: Deployment
metadata:
  name: ultimate-devops-app
  labels:
    app: ultimate-devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ultimate-devops-app
  template:
    metadata:
      labels:
        app: ultimate-devops-app
    spec:
      containers:
      - name: devops-app
        image: ultimate-devops-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
